clickable_minimum_required: 8.8.0
builder: cmake
kill: nextsign
# Headers/pkg-config only - the shipped click package links against the
# device's own libpoppler-qt5 runtime .so (present system-wide on every real
# UT device checked so far), it does not bundle poppler itself. An earlier
# attempt at this (2026-10-04) wrongly concluded poppler-qt5 wasn't available
# for cross-compilation at all - that was never actually true, it just hadn't
# been apt-installed yet when pkg-config was probed.
dependencies_target:
  - libpoppler-qt5-dev
scripts:
  desktop-large: ~/.local/bin/clickable desktop --arch amd64
  desktop-dark: bash scripts/desktop-dark.sh
  desktop-test: bash scripts/desktop-test.sh
  desktop-test-dark: bash scripts/desktop-test.sh --dark
  test: python3 -m unittest discover -s tests -v
  test-live: python3 -m unittest discover -s tests_live -v
